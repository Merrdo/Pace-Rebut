<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ee;--fg:#111;--dim:#8a8782;--surf:#fff;--surf2:#e9e6e0;--ink:#111;--ac:#111;--c:#ff90e8;--ct:#b8189a;--sp:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1);--nav-h:58px;--nav-gap:18px;--dock-space:calc(var(--nav-h) + var(--nav-gap) + 28px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box;margin:0;padding:0}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{width:100%;height:100dvh;background:var(--bg);color:var(--fg);overflow:hidden;font-family:"Baloo 2",ui-rounded,"Avenir Next",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.app{height:100dvh}

/* Alt cubuk */
.dock{--tw:112px;--th:calc(var(--nav-h) - 12px);--i:0;position:fixed;left:50%;bottom:calc(var(--nav-gap) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;display:flex;padding:6px;border-radius:999px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 10px 32px rgba(0,0,0,.1)}
.ind{position:absolute;top:6px;left:6px;width:var(--tw);height:var(--th);border-radius:999px;background:var(--fg);transform:translateX(calc(var(--i)*100%));transition:transform .65s var(--ease)}
.db{position:relative;z-index:1;width:var(--tw);height:var(--th);display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;color:var(--dim);font-size:15px;font-weight:700;transition:color .35s var(--ease),transform .5s var(--sp)}
.db:active{transform:scale(.95)}
.db svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.db.on{color:var(--bg)}
main{position:relative;overflow:hidden;height:100dvh}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;transform:scale(.985);transition:opacity .5s var(--ease),transform .6s var(--ease),visibility 0s .5s}
.view.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}

/* Konular */
#v-topics{display:grid;grid-template-columns:360px 1fr}
.subs{overflow:auto;padding:30px 24px var(--dock-space);overscroll-behavior:contain}
.hero{margin-bottom:26px}
.pc{display:flex;align-items:baseline;line-height:.9}
.pc b{font-family:Inter,"SF Pro Display",system-ui,sans-serif;font-weight:500;font-size:112px;letter-spacing:-5px}
.pc span{font-family:Inter,"SF Pro Display",system-ui,sans-serif;font-weight:500;font-size:36px;color:var(--dim);margin-left:4px}
.hl{margin-top:10px;font-size:20px;font-weight:700}
.hl small{display:block;font-size:14px;font-weight:500;color:var(--dim);cursor:pointer;margin-top:2px}
.grp{font-size:17px;font-weight:800;margin:24px 2px 12px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sub{position:relative;text-align:left;padding:14px 14px 24px;border-radius:18px;background:var(--surf);transition:background .4s var(--ease),transform .5s var(--sp)}
.sub:active{transform:scale(.96)}
.sub b{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;line-height:1.1}
.sub b:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;transition:background .4s var(--ease)}
.sub small{display:block;margin-top:4px;font-family:Inter,"SF Pro Display",system-ui,sans-serif;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--dim);transition:color .4s var(--ease)}
.sub .pb{position:absolute;left:14px;right:14px;bottom:11px;height:4px;border-radius:4px;background:var(--surf2);overflow:hidden;transition:background .4s var(--ease)}
.sub .pb i{display:block;height:100%;background:var(--c);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .8s var(--ease),background .4s var(--ease)}
.sub.on{background:var(--c)}
.sub.on b:before{background:var(--ink)}
.sub.on small{color:rgba(17,17,17,.6)}
.sub.on .pb{background:rgba(17,17,17,.14)}
.sub.on .pb i{background:var(--ink)}
.topics{overflow:auto;padding:34px 48px var(--dock-space);overscroll-behavior:contain}
.th{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.th h1{font-size:50px;font-weight:800;letter-spacing:-1px;line-height:1}
.th h1 em{font-style:normal;color:var(--ct);transition:color .5s var(--ease)}
.cn{font-family:Inter,"SF Pro Display",system-ui,sans-serif;font-weight:600;font-variant-numeric:tabular-nums;font-size:56px;letter-spacing:-2px;line-height:1;white-space:nowrap}
.cn small{font-size:22px;font-weight:500;color:var(--dim);margin-left:4px}
.bar{height:14px;border-radius:14px;background:var(--surf2);margin:18px 0 24px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:14px;background:var(--c);transform-origin:left;transform:scaleX(0);transition:transform .8s var(--ease),background .5s}
.list.in .tp{animation:rise .55s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.tp{display:flex;align-items:center;gap:16px;width:100%;padding:14px 18px;margin-bottom:10px;border-radius:18px;background:var(--surf);text-align:left;font-size:19px;font-weight:500;transition:background .35s,color .35s,transform .5s var(--sp)}
.tp:active{transform:scale(.975)}
.tp .tk{width:26px;height:26px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;flex:none;color:var(--dim);transition:color .3s}
.tp .tk svg{width:14px;height:14px;fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .45s var(--ease) .08s}
.tp.d{background:var(--c);color:var(--ink);font-weight:700}
.tp.d .tk{color:var(--ink);background:var(--ink)}
.tp.d .tk svg{stroke:var(--c);stroke-dashoffset:0}
.tp.pop{animation:pop .55s var(--sp)}
@keyframes pop{40%{transform:scale(1.025)}}

/* Ayarlar */
.set{position:absolute;inset:0;overflow:auto;padding:34px 24px var(--dock-space);overscroll-behavior:contain}
.setw{max-width:640px;margin:0 auto}
.set h1{font-size:50px;font-weight:800;letter-spacing:-1px;line-height:1;margin-bottom:24px}
.card{background:var(--surf);border-radius:20px;padding:20px;margin-bottom:14px}
.card h2{font-size:19px;font-weight:700}
.card p{margin-top:4px;font-size:14px;font-weight:500;color:var(--dim)}
.card .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.card input,.card textarea{display:block;width:100%;margin-top:14px;background:var(--surf2);color:var(--fg);border:0;border-radius:14px;padding:10px 14px;font-family:Inter,system-ui,sans-serif;font-size:16px;-webkit-user-select:text;user-select:text}
.card input{max-width:240px}
.card textarea{height:90px;resize:none}
.btn{padding:10px 18px;border-radius:14px;background:var(--surf2);font-size:16px;font-weight:700;transition:transform .5s var(--sp),background .3s,color .3s}
.btn:active{transform:scale(.96)}
.btn.pr{background:var(--fg);color:var(--bg)}
.btn.dg{color:#d12f35}
.btn.dg.arm{background:#d12f35;color:#fff}
.msg{margin-top:10px;font-size:14px;font-weight:500;color:var(--dim);min-height:1.2em}

/* Ders yonetimi */
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.view.on .card{animation:up .7s var(--ease) backwards}
.card:nth-child(3){animation-delay:.07s!important}.card:nth-child(4){animation-delay:.14s!important}.card:nth-child(5){animation-delay:.21s!important}
.lc{display:flex;align-items:center;gap:16px}.lc>div:first-child{flex:1}
.dots{display:flex;margin-top:14px;padding-left:4px}.dots i{width:20px;height:20px;border-radius:50%;background:var(--c);margin-left:-5px;border:2px solid var(--surf)}
.sheet{position:fixed;inset:0;z-index:8;background:var(--bg);overflow:auto;padding:34px 24px 70px;overscroll-behavior:contain;opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility 0s .5s}
.sheet.on{opacity:1;visibility:visible;transition-delay:0s}
.shw{max-width:640px;margin:0 auto;transform:translateY(30px) scale(.985);transition:transform .75s var(--ease)}
.sheet.on .shw{transform:none}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.sh-h h1{font-size:50px;font-weight:800;letter-spacing:-1px;line-height:1}
.sh-h p{margin-top:8px;font-size:14px;font-weight:500;color:var(--dim)}
.add{display:flex;align-items:center;gap:12px;width:100%;padding:16px 20px;border-radius:20px;background:var(--fg);color:var(--bg);font-size:18px;font-weight:700;transition:transform .5s var(--sp)}
.add:active{transform:scale(.98)}.add span{font-size:28px;line-height:1;transition:transform .6s var(--sp)}.add.open span{transform:rotate(135deg)}
.af{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}.af.open{grid-template-rows:1fr}
.afi{min-height:0;overflow:hidden;padding:6px;margin:-6px;opacity:0;transition:opacity .4s var(--ease)}.af.open .afi{opacity:1}
.seg{position:relative;display:flex;max-width:240px;margin-top:14px;padding:4px;border-radius:14px;background:var(--surf2)}
.seg i{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);border-radius:11px;background:var(--fg);transition:transform .6s var(--ease)}
.seg[data-g=AYT] i{transform:translateX(100%)}
.seg button{position:relative;flex:1;padding:8px;font-weight:700;color:#55524d;transition:color .35s}.seg button.on{color:var(--bg)}
.swr{display:flex;flex-wrap:wrap;gap:10px;padding:14px 8px 10px}
.swb{width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid var(--surf);box-shadow:0 0 0 2px transparent;transition:transform .5s var(--sp),box-shadow .35s}
.swb.on{box-shadow:0 0 0 2px var(--ct);transform:scale(1.14)}.swb:active{transform:scale(.88)}
.ll{display:flex;flex-direction:column}
.lw{display:grid;grid-template-rows:1fr;margin-bottom:10px;animation:up .65s var(--ease) var(--d,0ms) backwards;transition:grid-template-rows .45s var(--ease),margin .45s var(--ease),opacity .3s}
.lw .li{min-height:0;overflow:hidden;border-radius:20px}
.lw.out{grid-template-rows:0fr;margin-bottom:0;opacity:0}
.lr{background:var(--surf);background:color-mix(in srgb,var(--c) 15%,var(--surf));border-radius:20px;padding:12px 14px;transition:transform .5s var(--sp),box-shadow .4s}
.lh{display:flex;align-items:center;gap:12px}
.grip{width:34px;height:42px;display:grid;place-items:center;color:var(--dim);cursor:grab;touch-action:none;flex:none}
.grip svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}
.dot{width:36px;height:36px;border-radius:50%;background:var(--c);flex:none;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55);transition:transform .5s var(--sp)}.dot:active{transform:scale(.88)}
.ln{flex:1;min-width:0}.ln b{display:block;font-size:19px;font-weight:700}.ln small{font-size:14px;font-weight:500;color:var(--dim)}
.dl{padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.7);font-size:14px;font-weight:700;color:#d12f35;transition:background .3s,color .3s,transform .5s var(--sp)}.dl.arm{background:#d12f35;color:#fff}.dl:active{transform:scale(.95)}
.sw{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .55s var(--ease),opacity .4s}.lw.open .sw{grid-template-rows:1fr;opacity:1}
.swi{min-height:0;overflow:hidden}
.lw.drag{position:relative;z-index:3;will-change:transform}.ll.fast .sw{transition:none}.lw.drag.rel .lr{transform:none;box-shadow:none}.lw.drag .li{overflow:visible}
.lw.drag .lr{transform:scale(1.025);box-shadow:0 20px 44px rgba(0,0,0,.16)}.lw.drag .grip{cursor:grabbing}
.fl{height:44px;padding:0 18px;border-radius:999px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 8px 24px rgba(0,0,0,.1);font-size:16px;font-weight:700;transition:transform .5s var(--sp),opacity .45s var(--ease)}
.fl:active{transform:scale(.93)}
.fl-l{position:fixed;z-index:5;top:calc(18px + env(safe-area-inset-top,0px));left:24px;opacity:0;transform:translateY(-14px);pointer-events:none}
.fl-l.on{opacity:1;transform:none;pointer-events:auto}.fl-l.on:active{transform:scale(.93)}
.fl-r{position:fixed;z-index:5;top:calc(18px + env(safe-area-inset-top,0px));right:24px;display:flex;gap:10px}
.fp{width:44px;padding:0;display:grid;place-items:center;font-size:28px;line-height:1;font-weight:500}
.fk{background:var(--fg);color:var(--bg)}
.mod{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:24px;background:rgba(17,17,17,.26);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility 0s .45s}
.mod.on{opacity:1;visibility:visible;transition-delay:0s}
.mc{width:min(460px,100%);max-height:calc(100dvh - 48px);overflow:auto;margin:0;padding:24px;border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.22);transform:translateY(26px) scale(.93);opacity:0;transition:transform .65s var(--sp),opacity .4s var(--ease)}
.mod.on .mc{transform:none;opacity:1}
.mc input{max-width:none}
.fp{opacity:0;transform:scale(.6);pointer-events:none}.fp.on{opacity:1;transform:none;pointer-events:auto}.fp.on:active{transform:scale(.93)}
.em{padding:20px 4px;color:var(--dim);font-weight:500}
/* Sure */
@keyframes dn{50%{opacity:.3}}
.dock{transition:transform .75s var(--ease),opacity .45s var(--ease)}
.app.fs .dock{transform:translate(-50%,160%);opacity:0;pointer-events:none}
#v-timer{display:flex;align-items:center;justify-content:center}
.tw{display:flex;flex-direction:column;align-items:center;width:100%;padding:30px 24px var(--dock-space);transition:padding .8s var(--ease)}
.app.fs .tw{padding-bottom:30px}
.view.on .tw>*{animation:up .8s var(--ease) backwards}.view.on .tw>:nth-child(2){animation-delay:.06s}.view.on .tw>:nth-child(3){animation-delay:.1s}.view.on .tw>:nth-child(4){animation-delay:.14s}.view.on .tw>:nth-child(5){animation-delay:.2s}
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .65s var(--ease),opacity .45s var(--ease)}
.fold>div{min-height:0;overflow:hidden;padding:8px;margin:-8px}
.fold.off{grid-template-rows:0fr;opacity:0;pointer-events:none}
#tmode{width:330px;max-width:100%;margin:0}#tmode button{font-size:16px;color:#55524d}#tmode button.on{color:var(--bg)}#tmode button.bg:after{content:"";display:inline-block;width:6px;height:6px;margin-left:7px;border-radius:50%;background:#2fbf71;vertical-align:middle}.seg[data-m=cd] i{transform:translateX(100%)}
.clk{display:flex;align-items:baseline;margin:26px 0 6px;font-family:Inter,"SF Pro Display",system-ui,sans-serif;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:1;white-space:nowrap;font-size:min(19vw,32vh);transition:font-size .85s var(--ease)}
.clk.h{font-size:min(13.5vw,32vh)}
.app.fs .clk{font-size:min(24vw,50vh)}.app.fs .clk.h{font-size:min(16.5vw,50vh)}
.clk b{font-weight:inherit}
.clk u{display:inline-block;position:relative;width:.3em;height:.727em;text-decoration:none}
.clk u:before,.clk u:after{content:"";position:absolute;left:50%;width:.125em;height:.125em;margin-left:-.0625em;border-radius:50%;background:currentColor}
.clk u:before{top:.18em}.clk u:after{bottom:.18em}
.clk i{font-style:normal;color:var(--dim);font-size:.26em;letter-spacing:0;margin-left:.12em}
.view.on .tw>.clk.done{animation:dn 1.6s ease-in-out infinite}
.ts{min-height:1.4em;margin-bottom:12px;font-size:18px;font-weight:700;color:var(--dim)}
.pre{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:640px}
.chip{padding:9px 18px;border-radius:999px;background:var(--surf);font-size:16px;font-weight:700;transition:transform .5s var(--sp),background .35s,color .35s}
.chip:active{transform:scale(.94)}.chip.on{background:var(--fg);color:var(--bg)}
.tctl{display:flex;align-items:center;gap:24px;margin-top:26px}
.cb{position:relative;display:grid;place-items:center;width:66px;height:66px;border-radius:50%;background:var(--surf);transition:transform .5s var(--sp)}
.cb:active{transform:scale(.92)}
.cb.main{width:96px;height:96px;background:var(--fg);color:var(--bg)}
.cb svg{width:28px;height:28px}.cb.sec svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cb.main svg{grid-area:1/1;width:38px;height:38px;transition:opacity .3s,transform .55s var(--sp)}
.cb.main .i-p{opacity:0;transform:scale(.5)}.cb.main.on .i-p{opacity:1;transform:none}.cb.main.on .i-g{opacity:0;transform:scale(.5)}
.fsb{position:absolute;z-index:2;top:28px;right:24px;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--surf);transition:transform .5s var(--sp)}
.fsb:active{transform:scale(.92)}
.fsb svg{grid-area:1/1;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:opacity .3s,transform .5s var(--sp)}
.fsb .i-c{opacity:0;transform:scale(.5)}.fsb.on .i-c{opacity:1;transform:none}.fsb.on .i-e{opacity:0;transform:scale(.5)}
@media (max-width:1000px){#v-topics{grid-template-columns:300px 1fr}.topics{padding:28px 28px var(--dock-space)}.th h1{font-size:38px}.pc b{font-size:88px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:767px){.app:before{content:"Bu uygulama şimdilik tablet için tasarlandı.";position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--bg);color:var(--dim);text-align:center;padding:30px}}

/* Takvim */
.kz.no{animation:none}.kb.fsx svg{grid-area:1/1;transition:opacity .3s,transform .5s var(--sp)}.kb.fsx{grid-template:1fr/1fr}.kb.fsx .i-c{opacity:0;transform:scale(.5)}.kb.fsx.on .i-c{opacity:1;transform:none}.kb.fsx.on .i-e{opacity:0;transform:scale(.5)}
.seg[data-k=task] [data-k=task],.seg[data-k=ev] [data-k=ev],.seg[data-k=sp] [data-k=sp]{color:var(--bg)}
.card .chip{background:var(--surf2);color:#55524d}.card .chip.on{background:var(--fg);color:var(--bg)}
.gl{margin-top:14px}.gr{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:4px;border-radius:14px}.gl{--gk:#2fbf71;--gt:#1d8a50}.gl.w{--gk:#9b6cff;--gt:#6a3fd1}.gm{margin:18px 12px 6px;font-size:16px;font-weight:800}.gm:first-child{margin-top:4px}.gr.up{background:color-mix(in srgb,var(--gk) 16%,transparent)}.gr.pa{opacity:.5}.gr em{flex:none;font-style:normal;font-size:13px;font-weight:700;color:var(--gt)}.card .chip.on[data-lt=r]{background:#2fbf71;color:#fff}.card .chip.on[data-lt=w]{background:#9b6cff;color:#fff}.gr i{width:10px;height:10px;border-radius:50%;background:var(--gk);flex:none}.gr b{width:96px;flex:none;font:600 15px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}.gr span{flex:1;font-size:16px;font-weight:500}.gy{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}.gy b{font:600 20px Inter,system-ui,sans-serif;min-width:56px;text-align:center}
#v-cal{overflow:hidden}
.cal{position:absolute;inset:0;display:flex;flex-direction:column;padding:26px 36px var(--dock-space);transition:padding .8s var(--ease)}

function its(y,m,d){var s=ds(y,m,d);return CS.items.filter(function(i){return i.d===s||(i.y&&i.d.slice(5)===s.slice(5)&&i.d<=s)}).sort(function(a,b){return(a.tm||"99").localeCompare(b.tm||"99")})}
function isT(y,m,d){return y===TD.getFullYear()&&m===TD.getMonth()&&d===TD.getDate()}
var IC={p:'<path d="M15 5l-7 7 7 7"/>',n:'<path d="M9 5l7 7-7 7"/>',fs:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',fx:'<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>',st:'<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/>'};
function ib(a,i,x){return'<button class="kb'+(x||"")+'" data-a="'+a+'" aria-label="'+a+'"><svg viewBox="0 0 24 24">'+IC[i]+'</svg></button>'}
function paintK(q){
  var l=cv.l,t=l==="year"?'<span>'+cv.y+'</span>':l==="month"?'<button data-a="y">'+cv.y+'</button><span>'+MN[cv.m]+'</span>':'<button data-a="y">'+cv.y+'</button><button data-a="mo">'+MN[cv.m]+'</button><span>'+cv.d+'</span>',
  fs=$(".app").classList.contains("fs");
  $("#cal").innerHTML='<div class="kh"><div class="kt">'+t+'</div><div class="kc">'+ib("pv","p")+'<button class="kb w" data-a="td">Bugün</button>'+ib("nx","n")+'<button class="kb fsx'+(fs?" on":"")+'" data-a="fs" aria-label="Tam ekran"><svg class="i-e" viewBox="0 0 24 24">'+IC.fs+'</svg><svg class="i-c" viewBox="0 0 24 24">'+IC.fx+'</svg></button>'+ib("st","st")+'</div></div><div class="kbody"><div class="kz '+(q?"no":cv.dir)+'">'+(l==="year"?rY():l==="month"?rM():rD())+'</div></div>';
  if(l==="day")dayList();
}
function rY(){
  var h='<div class="yg">';
  for(var m=0;m<12;m++){
    var o=wdx(cv.y,m,1),n=dim(cv.y,m);
    h+='<button class="mm'+(isT(cv.y,m,TD.getDate())?" now":"")+'" data-a="m" data-m="'+m+'" style="--n:'+m+'"><b>'+MN[m]+'</b><div class="mg">'+"PSÇPCCP".split("").map(function(x){return"<i>"+x+"</i>"}).join("")+Array(o+1).join("<u></u>");
    for(var d=1;d<=n;d++){var c=(isT(cv.y,m,d)?"t ":"")+(function(x){return x.some(function(y){return y.g!=="w"})?"hr ":x.length?"hw ":""})(hs(cv.y,m,d))+(its(cv.y,m,d).length?"e":"");h+='<s class="'+c+'">'+d+'</s>'}
    h+='</div></button>';
  }
  return h+'</div>';
}
function rM(){
  var o=wdx(cv.y,cv.m,1),n=dim(cv.y,cv.m),rows=Math.ceil((o+n)/7),h='<div class="wk">'+WD.map(function(x){return"<span>"+x.slice(0,3)+"</span>"}).join("")+'</div><div class="mg2" style="grid-template-rows:repeat('+rows+',1fr)">';
  for(var c=0;c<rows*7;c++){
    var d=c-o+1;if(d<1||d>n){h+='<i class="dc pd"></i>';continue}
    var ch=hs(cv.y,cv.m,d).map(function(x){return[x.n,GC[x.g]]}).concat(its(cv.y,cv.m,d).map(function(x){return[x.t,KC[x.k]]})),v=ch.slice(0,3);
    h+='<button class="dc'+(isT(cv.y,cv.m,d)?" t":"")+'" data-a="d" data-d="'+d+'" style="--n:'+c+'"><b>'+d+'</b>'+v.map(function(x){return'<span class="cp" style="--k:'+x[1]+'">'+esc(x[0])+'</span>'}).join("")+(ch.length>3?'<span class="cp mo">+'+(ch.length-3)+' daha</span>':'')+'</button>';
  }
  return h+'</div>';
}
function rD(){
  return'<div class="dv"><div class="dl2 card"><small>'+MN[cv.m]+' '+cv.y+(isT(cv.y,cv.m,cv.d)?' · Bugün':'')+'</small><div class="bn">'+cv.d+'</div><h2>'+WD[wdx(cv.y,cv.m,cv.d)]+'</h2><div id="dh"></div></div><div class="dr"><div class="df card"><div class="seg" id="sk" data-k="'+cv.k+'"><i></i><button data-a="k" data-k="task">Görev</button><button data-a="k" data-k="ev">Randevu</button><button data-a="k" data-k="sp">Özel gün</button></div><input id="it" maxlength="80" placeholder="Örn. Kardeşimin doğum günü"><div class="row"><input type="time" id="tm" style="display:'+(cv.k==="ev"?"block":"none")+'"><button class="chip'+(cv.k==="sp"?" on":"")+'" id="ty" data-a="ty">Her yıl tekrarla</button></div><div class="row"><button class="btn pr" id="sv" data-a="sv">Ekle</button><button class="btn" id="cx" data-a="cx" style="display:none">İptal</button><button class="btn dg" id="dx" data-a="dx" style="display:none">Sil</button></div></div><div id="dli"></div></div></div>';
}
function dayList(){
  var y=cv.y,m=cv.m,d=cv.d;
  $("#dh").innerHTML=hs(y,m,d).map(function(h){return'<span class="cp big" style="--k:'+GC[h.g]+'">'+esc(h.n)+'</span>'}).join("")||'<p class="em" style="padding:0">Resmi veya özel gün yok.</p>';
  var it=its(y,m,d);
  $("#dli").innerHTML=it.length?it.map(function(i,n){return'<div class="ir'+(i.x?" d":"")+'" data-id="'+i.id+'" style="animation-delay:'+n*40+'ms"><button class="ik" data-a="tg" style="--k:'+KC[i.k]+'"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg></button><button class="itx" data-a="ed"><b>'+esc(i.t)+'</b><small>'+KL[i.k]+(i.tm?" · "+i.tm:"")+(i.y?" · Her yıl":"")+'</small></button></div>'}).join(""):'<p class="em">Bu güne henüz bir şey eklenmedi.</p>';
}
function setK(k){cv.k=k;$("#sk").dataset.k=k;$$("#sk button").forEach(function(x){x.classList.toggle("on",x.dataset.k===k)});$("#tm").style.display=k==="ev"?"block":"none";if(!cv.ed)$("#ty").classList.toggle("on",k==="sp")}
function clr(){cv.ed=0;$("#it").value="";$("#tm").value="";$("#sv").textContent="Ekle";$("#cx").style.display=$("#dx").style.display="none";setK(cv.k)}
function find(id){return CS.items.filter(function(i){return i.id===id})[0]}
function step(n){
  var t;
  if(cv.l==="year")cv.y+=n;
  else if(cv.l==="month"){t=new Date(cv.y,cv.m+n,1);cv.y=t.getFullYear();cv.m=t.getMonth();cv.d=Math.min(cv.d,dim(cv.y,cv.m))}
  else{t=new Date(cv.y,cv.m,cv.d+n);cv.y=t.getFullYear();cv.m=t.getMonth();cv.d=t.getDate()}
  cv.dir=n>0?"nx":"pv";cv.ed=0;paintK();
}
function lvl(l,dir){cv.l=l;cv.dir=dir;cv.ed=0;paintK()}
var dt;
$("#cal").addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
  if(a==="m"){cv.m=+b.dataset.m;cv.d=Math.min(cv.d,dim(cv.y,cv.m));lvl("month","in")}
  else if(a==="d"){cv.d=+b.dataset.d;lvl("day","in")}
  else if(a==="y")lvl("year","out");else if(a==="mo")lvl("month","out");
  else if(a==="pv")step(-1);else if(a==="nx")step(1);
  else if(a==="td"){var sm=cv.y===TD.getFullYear()&&cv.m===TD.getMonth()&&(cv.l!=="day"||cv.d===TD.getDate());cv.y=TD.getFullYear();cv.m=TD.getMonth();cv.d=TD.getDate();cv.dir="in";paintK(sm)}
  else if(a==="fs"){$("#fsb").click();b.classList.toggle("on",$(".app").classList.contains("fs"))}
  else if(a==="st"){paintS();$("#cset").classList.add("on")}
  else if(a==="k")setK(b.dataset.k);
  else if(a==="ty")b.classList.toggle("on");
  else if(a==="sv")svI();
  else if(a==="cx")clr();
  else if(a==="tg"){var i=find(+b.closest(".ir").dataset.id);i.x=i.x?0:1;csv();b.closest(".ir").classList.toggle("d",!!i.x)}
  else if(a==="ed"){var i=find(+b.closest(".ir").dataset.id);cv.ed=i.id;$("#it").value=i.t;$("#tm").value=i.tm||"";$("#ty").classList.toggle("on",!!i.y);setK(i.k);$("#sv").textContent="Kaydet";$("#cx").style.display=$("#dx").style.display="";$("#it").focus()}
  else if(a==="dx"){
    if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent="Emin misin?";clearTimeout(dt);dt=setTimeout(function(){b.classList.remove("arm");b.textContent="Sil"},3000);return}
    CS.items=CS.items.filter(function(i){return i.id!==cv.ed});b.classList.remove("arm");b.textContent="Sil";csv();clr();dayList();
  }
});
$("#cal").addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="it")svI()});
function svI(){
  var t=$("#it").value.trim();if(!t){$("#it").focus();return}
  var o=cv.ed&&find(cv.ed),y=$("#ty").classList.contains("on"),tm=cv.k==="ev"?$("#tm").value:"";
  if(o){o.t=t;o.k=cv.k;o.tm=tm;o.y=y}else CS.items.push({id:CS.nid++,d:ds(cv.y,cv.m,cv.d),t:t,k:cv.k,tm:tm,y:y,x:0});
  csv();clr();dayList();
}
var KS=[["r","Resmi tatiller ve özel günler","Türkiye: resmi tatiller, dini ve milli bayramlar, anma günleri, Anneler/Babalar Günü"],["w","Uluslararası özel günler","Dünya: Noel, Cadılar Bayramı, Yılbaşı Gecesi, Dünya Erkekler Günü, Sevgililer Günü…"]],cl={y:TD.getFullYear(),t:"r"};
function glist(){
  var h=hol(cl.y),o=[],ty=TD.getFullYear()===cl.y,tk=p2(TD.getMonth()+1)+"-"+p2(TD.getDate()),up={},c=0,pm=-1,out="";
  Object.keys(h).forEach(function(k){h[k].forEach(function(x){if((x.g==="w")===(cl.t==="w"))o.push([k,x])})});
  o.sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0});
  if(ty)o.forEach(function(r){if(r[0]>=tk&&!up[r[0]]&&c<3){up[r[0]]=1;c++}});
  o.forEach(function(r){
    var m=+r[0].slice(0,2)-1,d=+r[0].slice(3),u=up[r[0]],n=Math.round((new Date(cl.y,m,d)-new Date(cl.y,TD.getMonth(),TD.getDate()))/864e5);
    if(m!==pm){pm=m;out+='<div class="gm">'+MN[m]+'</div>'}
    out+='<div class="gr'+(u?" up":ty&&r[0]<tk?" pa":"")+'"><i></i><b>'+d+' '+MN[m].slice(0,3)+' '+WD[wdx(cl.y,m,d)].slice(0,3)+'</b><span>'+esc(r[1].n)+'</span>'+(u?'<em>'+(n?n===1?"Yarın":n+" gün sonra":"Bugün")+'</em>':'')+'</div>';
  });
  if(cl.t==="r"&&cl.y>2027)out+='<p class="em">Dini bayram tarihleri '+(RB[cl.y]?"tahminidir, Diyanet takvimi yayımlanınca ±1 gün değişebilir.":"bu yıl için eklenmedi.")+'</p>';
  return out||'<p class="em">Bu yıl için kayıt yok.</p>';
}
function updL(){$("#gyv").textContent=cl.y;$$("[data-lt]").forEach(function(b){b.classList.toggle("on",b.dataset.lt===cl.t)});var g=$("#gl");g.className="gl "+cl.t;g.innerHTML=glist()}
function paintS(){
  $("#cset").innerHTML='<div class="setw"><div class="sh-h"><div><h1>Takvim ayarları</h1><p>Hangi özel günler takvimde görünsün?</p></div><button class="btn pr" data-x="1">Bitti</button></div>'+KS.map(function(k){return'<div class="card lc"><div><h2>'+k[1]+'</h2><p>'+k[2]+'</p></div><button class="tg'+(CS.set[k[0]]?" on":"")+'" data-g="'+k[0]+'" aria-label="'+k[1]+'"><i></i></button></div>'}).join("")+
  '<div class="card" id="glc"><h2>Gün listesi</h2><p>Hangi gün hangi tarihe denk geliyor.</p><div class="gy"><button class="kb" data-ly="-1" aria-label="Önceki yıl"><svg viewBox="0 0 24 24">'+IC.p+'</svg></button><b id="gyv">'+cl.y+'</b><button class="kb" data-ly="1" aria-label="Sonraki yıl"><svg viewBox="0 0 24 24">'+IC.n+'</svg></button><button class="chip'+(cl.t==="r"?" on":"")+'" data-lt="r">Türkiye</button><button class="chip'+(cl.t==="w"?" on":"")+'" data-lt="w">Uluslararası</button></div><div class="gl '+cl.t+'" id="gl">'+glist()+'</div></div></div>';
}
$("#cset").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.x){$("#cset").classList.remove("on");paintK(true)}
  else if(b.dataset.g){CS.set[b.dataset.g]=CS.set[b.dataset.g]?0:1;b.classList.toggle("on",!!CS.set[b.dataset.g]);csv()}
  else if(b.dataset.ly||b.dataset.lt){if(b.dataset.ly)cl.y+=+b.dataset.ly;else cl.t=b.dataset.lt;updL()}
});
var sw=0;
function swp(el,ok,cb){
  var x0=0,y0=0,t0=0,on=0;
  el.addEventListener("pointerdown",function(e){if(e.pointerType==="mouse"&&e.button){on=0;return}on=ok(e.target)?1:0;x0=e.clientX;y0=e.clientY;t0=Date.now()});
  el.addEventListener("pointerup",function(e){
    if(!on)return;on=0;var dx=e.clientX-x0,dy=e.clientY-y0;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-t0<900){sw=1;setTimeout(function(){sw=0},80);cb(dx<0?1:-1)}
  });
  el.addEventListener("pointercancel",function(){on=0});
  el.addEventListener("click",function(e){if(sw){e.stopPropagation();e.preventDefault()}},true);
}
swp($("#cal"),function(t){return!!t.closest(".kbody")&&!t.closest("input,textarea")},step);
swp($("#cset"),function(t){return!!t.closest("#glc")},function(n){cl.y+=n;updL()});
paintK();

/* Gezinme */
$$(".db").forEach(function(b,n){b.onclick=function(){
  $("#dock").style.setProperty("--i",n);
  $$(".db").forEach(function(x){x.classList.toggle("on",x===b)});
  $$(".view").forEach(function(e){e.classList.toggle("on",e.id==="v-"+b.dataset.v)});
}});

if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
